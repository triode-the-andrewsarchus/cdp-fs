[package]
name = "cdp-fs"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
fuser = "0.18.0"
libc = "0.2.191"
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
ureq = "3.5.0"
